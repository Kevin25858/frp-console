services:
  frp-console:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # npm 镜像源（国内可设为 https://registry.npmmirror.com 加速）
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    container_name: frp-console
    restart: unless-stopped
    ports:
      - "${PORT:-7600}:7600"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-7600}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/frpc:/opt/frpc
    group_add:
      - "${DOCKER_GID:-999}"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7600/login')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
