name: 功能请求
description: 建议一个新功能
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的功能建议！请填写以下信息帮助我们理解你的需求。

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 描述你想要解决的问题或痛点
      placeholder: 我遇到了什么问题...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 描述你希望如何解决
      placeholder: 我希望能够实现...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 描述你考虑过的替代方案
      placeholder: 我也考虑过...

  - type: textarea
    id: context
    attributes:
      label: 其他信息
      description: 任何其他相关的上下文信息

  - type: checkboxes
    id: terms
    attributes:
      label: 确认事项
      options:
        - label: 我已经搜索过现有的 issues，确认这个功能没有被建议过
          required: true
