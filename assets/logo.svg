<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- 背景圆形 -->
  <circle cx="60" cy="60" r="55" fill="#3B82F6"/>

  <!-- 内部深色圆 -->
  <circle cx="60" cy="60" r="45" fill="#1E40AF"/>

  <!-- FRP 文字 -->
  <text x="60" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">FRP</text>

  <!-- 连接线图案 -->
  <line x1="30" y1="65" x2="45" y2="65" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="75" y1="65" x2="90" y2="65" stroke="white" stroke-width="3" stroke-linecap="round"/>

  <!-- 中心节点 -->
  <circle cx="60" cy="65" r="8" fill="white"/>

  <!-- 客户端节点 -->
  <circle cx="30" cy="65" r="5" fill="#60A5FA"/>
  <circle cx="90" cy="65" r="5" fill="#60A5FA"/>

  <!-- 底部文字 -->
  <text x="60" y="85" font-family="Arial, sans-serif" font-size="10" fill="#93C5FD" text-anchor="middle">CONSOLE</text>
</svg>
